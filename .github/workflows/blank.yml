name: Build PE for denniz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install repo git-core gnupg flex bison gperf \
            build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Sync ROM
        run: |
          repo init -u https://github.com/YOUR_USERNAME/pe_manifest.git -b fourteen
          repo sync -j$(nproc --all)

      - name: Lunch & Build
        run: |
          source build/envsetup.sh
          lunch aosp_denniz-userdebug
          mka bacon

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: PixelExperience_denniz.zip
          path: out/target/product/denniz/*.zip
